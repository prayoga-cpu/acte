name: deploy-beta
# Deploys main to the Vercel beta (D-013, D-016) after CI passes on it:
# bundle check → Neon migrations → API → web → smoke test (scripts/deploy-beta.sh).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # The only secret: the script reads the database URL from the Vercel project with this token.
      - name: Skip until the Vercel token is configured
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret missing: beta not deployed. Add it with: gh secret set VERCEL_TOKEN"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.ready == 'true'
        run: npm install --global vercel@58.10.0
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/deploy-beta.sh
