name: ci
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prototype is unchanged
        run: bash scripts/verify-prototype.sh
      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: guard
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acte
          POSTGRES_PASSWORD: acte
          POSTGRES_DB: acte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://acte:acte@localhost:5432/acte
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      COMPLIANCE_CLAIMS_ENABLED: "false"
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests (contracts, api) need no running services.
      - run: pnpm --filter @acte/contracts --filter @acte/api test

      - name: Generate CI-only secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # tsc compiles cleanly (a build-time sanity check), but the API's actual
      # runtime is tsx in every environment — see apps/api/package.json "start".
      - run: pnpm --filter @acte/api build
      - run: pnpm --filter @acte/api db:migrate
      - run: pnpm --filter @acte/api db:seed
      - run: pnpm --filter @acte/api start &
      - run: pnpm --filter @acte/web build
      - run: pnpm --filter @acte/web start &
      - name: Wait for API and web to accept connections
        run: |
          timeout 30 bash -c 'until curl -sf -o /dev/null -w "%{http_code}" http://localhost:4000/v1/me/profile | grep -q 401; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000/login -o /dev/null; do sleep 1; done'

      - run: pnpm --filter @acte/web exec playwright install --with-deps chromium
      # e2e (Playwright), against the seeded demo firm — docs/04-engineering/TESTING.md.
      - run: pnpm --filter @acte/web test
